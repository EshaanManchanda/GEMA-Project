# Local test stack: `docker compose up -d --build`
#   Frontend  http://localhost:3000
#   API       http://localhost:5001/api/health
#   Emails    http://localhost:8025   (Mailpit catches every outgoing email)
#   Mongo     mongodb://localhost:27017/gema?directConnection=true  (Compass)
# Real Stripe test keys etc. go in docker/backend.local.env (gitignored).
name: kidrove

x-backend: &backend
  build:
    context: ./backend
    target: development
  image: kidrove-backend-dev
  env_file:
    - docker/backend.env
    - path: docker/backend.local.env
      required: false
  volumes:
    - ./backend/src:/app/src
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started
  restart: unless-stopped

services:
  mongo:
    image: mongo:8.0
    container_name: kidrove-mongo
    # Single-node replica set: the app uses transactions (booking, payouts, …)
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e)
        { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kidrove-redis
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: kidrove-mailpit
    ports: ["8025:8025", "1025:1025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  backend:
    <<: *backend
    container_name: kidrove-backend
    # -L: polling, file events don't cross Windows bind mounts
    command: ["npx", "nodemon", "-L", "--watch", "src", "--ext", "ts", "src/server.ts"]
    ports: ["5001:5001"]

  worker:
    <<: *backend
    container_name: kidrove-worker
    command: ["npx", "nodemon", "-L", "--watch", "src", "--ext", "ts", "src/workers/index.ts"]

  frontend:
    image: node:22-alpine
    container_name: kidrove-frontend
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 3000"
    ports: ["3000:3000"]
    environment:
      VITE_API_URL: http://localhost:5001/api   # the browser calls the API directly
      VITE_API_PROXY_TARGET: http://backend:5001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules   # keep Linux deps off the Windows tree
    depends_on: [backend]
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  frontend-node-modules:
