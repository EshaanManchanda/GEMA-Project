# CSP violation reports (see security-headers.conf). Include in each HTTPS
# frontend server block. Reports land in /var/log/nginx/csp-reports.log;
# the body is only captured because it's proxied to the 204 sink in kidrove.conf.
location = /csp-report {
    limit_except POST { deny all; }
    limit_req zone=kidrove_general_limit burst=20 nodelay;
    client_max_body_size 64k;
    access_log /var/log/nginx/csp-reports.log csp_report;
    proxy_pass http://127.0.0.1:8099;
}
