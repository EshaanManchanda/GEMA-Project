# Security Headers Configuration
# Adds HTTP security headers to responses
# Include this in server blocks with: include snippets/security-headers.conf;

# X-Frame-Options - prevents clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# X-Content-Type-Options - prevents MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection - enables browser XSS filter (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy - controls referrer information sent with requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Strict-Transport-Security (HSTS) - forces HTTPS for 1 year
# includeSubDomains: applies to all subdomains (api.kidrove.com, etc.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy in REPORT-ONLY mode: browsers report violations to
# /csp-report (snippets/csp-report.conf) but block nothing. Review the log for
# ~1 week, adjust, then rename the header to Content-Security-Policy to enforce.
# The sha256 is the fonts <link onload> handler in frontend/index.html; if that
# handler changes, recompute it:
#   printf %s "<handler>" | openssl dgst -sha256 -binary | base64
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-1jAmyYXcRq6zFldLe/GCgIDJBiOONdXjTLgEFMDnDSM=' https://js.stripe.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.kidrove.com https://api.kidrove.in https://api.kidrove.ae wss://api.kidrove.com wss://api.kidrove.in wss://api.kidrove.ae https://*.googleapis.com https://*.stripe.com https://api.cloudinary.com https://res.cloudinary.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.firebaseapp.com https://www.youtube.com https://player.vimeo.com https://www.google.com https://maps.google.com https://www.openstreetmap.org https://www.instagram.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /csp-report" always;
